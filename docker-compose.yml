version: '3.8'
services:
  app:
    build: .
    container_name: baileys-app
    environment:
      PORT: ${PORT:-3000}
      SQLITE_FILE: /data/data.sqlite
      POSTBACK_URL: ${POSTBACK_URL:-http://localhost:3000/webhook}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - sqlite-data:/data
    command: ["npm", "start"]

volumes:
  sqlite-data:
